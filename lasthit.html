<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>补刀练习 · 刀塔法庭</title>
<meta name="description" content="刀塔法庭的补刀练习小游戏：两分钟内能补几刀？" />
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #07080c; --panel: #141721; --gold: #f2b632; --green: #4ade80; --red: #f87171; --muted: #94a3b8; --text: #e8e2d4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(ellipse at 50% 0%, #1b1f2e, var(--bg) 70%); color: var(--text); font-family: "Noto Sans SC", system-ui, sans-serif; min-height: 100vh; }
  a { color: var(--gold); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 14px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  h1 { margin: 0; font: 400 34px "ZCOOL QingKe HuangYou", sans-serif; color: var(--gold); letter-spacing: 2px; text-shadow: 0 3px 0 #7c2d12; }
  .back { font-size: 13px; text-decoration: none; padding: 4px 10px; border: 1px solid rgba(242,182,50,.4); border-radius: 99px; }
  .hud { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 8px; }
  .hud div { background: var(--panel); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 6px 4px; text-align: center; }
  .hud b { display: block; font-size: 22px; font-family: ui-monospace, monospace; }
  .hud span { font-size: 11px; color: var(--muted); }
  .hud .lh b { color: var(--green); } .hud .dn b { color: #7dd3fc; } .hud .ms b { color: var(--red); } .hud .gd b { color: var(--gold); }
  .stage { position: relative; border-radius: 14px; overflow: hidden; border: 2px solid rgba(242,182,50,.35); box-shadow: 0 16px 40px rgba(0,0,0,.5); touch-action: manipulation; }
  canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; }
  .bubble { position: absolute; left: 10px; top: 10px; max-width: 70%; background: #fff; color: #111; font-weight: 800; font-size: 14px; padding: 6px 12px; border-radius: 14px;
    border: 2px solid #fde047; opacity: 0; transform: translateY(-6px); transition: .2s; pointer-events: none; }
  .bubble.show { opacity: 1; transform: none; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center;
    background: rgba(5,6,10,.82); backdrop-filter: blur(2px); }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font: 400 34px "ZCOOL QingKe HuangYou", sans-serif; color: var(--gold); }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; max-width: 520px; line-height: 1.6; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  select, button { font: inherit; font-size: 15px; border-radius: 10px; padding: 8px 14px; border: 1px solid rgba(242,182,50,.5); background: #1d2130; color: var(--text); }
  button.go { background: var(--gold); color: #111; font-weight: 900; border: 0; padding: 10px 26px; font-size: 18px; cursor: pointer; }
  button.ghost { cursor: pointer; }
  .diff button { cursor: pointer; } .diff button.on { background: var(--gold); color: #111; font-weight: 800; }
  .result b { color: var(--gold); }
  .bests { margin-top: 18px; background: var(--panel); border-radius: 14px; padding: 12px 14px; border: 1px solid rgba(255,255,255,.08); }
  .bests h3 { margin: 0 0 8px; font-size: 16px; color: var(--gold); }
  .bests table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .bests td, .bests th { padding: 4px 6px; border-top: 1px solid rgba(255,255,255,.07); text-align: left; }
  .bests th { color: var(--muted); font-size: 12px; border: 0; }
  .help { margin-top: 14px; font-size: 13px; color: var(--muted); line-height: 1.7; }
  @media (max-width: 600px) { h1 { font-size: 26px; } .hud b { font-size: 18px; } .hud span { font-size: 10px; } }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>补刀练习</h1><a class="back" href="./">← 回到刀塔法庭</a></header>
  <div class="hud">
    <div class="lh"><b id="h-lh">0</b><span>补刀</span></div>
    <div class="dn"><b id="h-dn">0</b><span>反补</span></div>
    <div class="ms"><b id="h-ms">0</b><span>没补到</span></div>
    <div class="gd"><b id="h-gd">0</b><span>金钱</span></div>
    <div><b id="h-tm">2:00</b><span>剩余时间</span></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" width="320" height="180"></canvas>
    <div class="bubble" id="bubble"></div>
    <div class="overlay" id="menu">
      <h2>两分钟，能补几刀？</h2>
      <p>敌方小兵（红）血量快没的时候，点它完成补刀；我方小兵（绿）血量低于一半时点它就是反补。英雄出手有前摇，要提前一点点点！</p>
      <div class="row">
        <label>我是 <select id="who"></select></label>
      </div>
      <div class="row diff" id="diff">
        <button data-d="easy">简单 · 显示血量</button>
        <button data-d="normal" class="on">普通</button>
        <button data-d="hard">困难 · 前摇更长</button>
      </div>
      <button class="go" id="start">开始补刀</button>
    </div>
    <div class="overlay" id="end" hidden>
      <h2 id="end-title">时间到！</h2>
      <p class="result" id="end-text"></p>
      <p id="end-taunt"></p>
      <div class="row">
        <button class="go" id="again">再来一局</button>
        <button class="ghost" id="copy">复制成绩发群里</button>
        <button class="ghost" id="tomenu">换人 / 换难度</button>
      </div>
    </div>
  </div>
  <div class="bests"><h3>🏆 各位大神的最佳纪录（本机）</h3><table id="bests"></table></div>
  <div class="help">
    规则：每局 2 分钟，每 15 秒一波兵（每边 4 个）。补刀 +40 金，反补 +10 金。点到了却没打死 = “没补到”。<br>
    小技巧：看清自己的攻击力（屏幕左下角），等小兵血量快接近这个数字的时候再出手；困难模式前摇更长，要更早点。
  </div>
</div>

<script src="js/config.js"></script>
<script>
(() => {
  const W = 320, H = 180, LANE_Y = 104;
  const cv = document.getElementById("cv"), g = cv.getContext("2d");
  g.imageSmoothingEnabled = false;
  const $ = (id) => document.getElementById(id);

  // ---------- giocatori del sito ----------
  const PEOPLE = (window.TRIBUNALE_CONFIG?.players || []).map((p) => p.alias).filter(Boolean);
  $("who").innerHTML = PEOPLE.map((n) => `<option>${n}</option>`).join("") + `<option>路人</option>`;
  try { const last = localStorage.getItem("lh:who"); if (last) $("who").value = last; } catch {}

  // ---------- difficoltà ----------
  const DIFF = {
    easy: { name: "简单", windup: 0.25, showHp: true, dmg: [52, 58] },
    normal: { name: "普通", windup: 0.35, showHp: false, dmg: [50, 56] },
    hard: { name: "困难", windup: 0.5, showHp: false, dmg: [48, 54] },
  };
  let diff = "normal";
  $("diff").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    diff = b.dataset.d; [...$("diff").children].forEach((x) => x.classList.toggle("on", x === b));
  });

  // ---------- sprite pixel (disegnati da matrici) ----------
  function sprite(rows, pal) {
    const c = document.createElement("canvas"); c.width = rows[0].length; c.height = rows.length;
    const x = c.getContext("2d");
    rows.forEach((r, y) => [...r].forEach((ch, i) => { if (pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i, y, 1, 1); } }));
    return c;
  }
  const CREEP = [
    "....hhhh....",
    "...hhhhhh...",
    "...hssssh...",
    "...sesses...",
    "....ssss....",
    "..aabbbbaa..",
    ".aabbbbbbaa.",
    ".s.bbbbbb.sw",
    ".s.bbccbb.sw",
    "...bbbbbb..w",
    "....l..l....",
    "...ll..ll...",
  ];
  const creepR = sprite(CREEP, { h: "#9ca3af", s: "#e0b48a", e: "#111", a: "#78716c", b: "#4d7c0f", c: "#84cc16", l: "#3f2d20", w: "#e5e7eb" });
  const creepD = sprite(CREEP, { h: "#57534e", s: "#b9876b", e: "#111", a: "#292524", b: "#7f1d1d", c: "#ef4444", l: "#1c1917", w: "#e5e7eb" });
  const HERO = [
    ".....kkk.....",
    "....kkkkk....",
    "....kffff....",
    "....fefef....",
    ".....fff.....",
    "...ttttttt...",
    "..tttgggttt..",
    "..f.tggggt.f.",
    "..f.ttttt..f.",
    ".....t.t.....",
    "....pp.pp....",
    "....p...p....",
  ];
  const hero = sprite(HERO, { k: "#1e293b", f: "#f2c9a8", e: "#111", t: "#2563eb", g: "#fde047", p: "#334155" });
  const tree = sprite([
    "....gg....", "...gggg...", "..gGgggg..", ".gggGgggg.", "..gggggG..", ".gGgggggg.", "gggggGgggg", "..gggggg..", "....bb....", "....bb....",
  ], { g: "#166534", G: "#22c55e", b: "#5b3a1e" });

  // ---------- stato ----------
  let creeps = [], fx = [], st = null, raf = 0, last = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);

  function wave() {
    for (let i = 0; i < 4; i++) {
      creeps.push({ side: "r", x: -10 - i * 14, y: LANE_Y + (i % 4) * 5 - 8, hp: 550, max: 550, cd: rnd(0, 1), id: Math.random() });
      creeps.push({ side: "d", x: W + 10 + i * 14, y: LANE_Y + (i % 4) * 5 - 8, hp: 550, max: 550, cd: rnd(0, 1), id: Math.random() });
    }
  }

  function start() {
    try { localStorage.setItem("lh:who", $("who").value); } catch {}
    creeps = []; fx = [];
    st = { t: 120, lh: 0, dn: 0, ms: 0, gold: 0, nextWave: 0, atk: null, heroX: W / 2, lastHit: 0, combo: 0 };
    $("menu").hidden = true; $("end").hidden = true;
    say(["开始补刀，别给大P神丢脸", "小金金都能补，你也能", "放松，补刀而已"][Math.floor(Math.random() * 3)]);
    last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
  }

  // ---------- 大P神 commenta ----------
  const MISS = ["补刀？不存在的", "Ping大神附体了？", "真菜", "这刀是送给空气的吗", "笑死我了", "哎呀你这波操作", "小金金都比你会补"];
  const GOOD = ["这刀可以", "漂亮！", "有点东西", "职业选手？", "稳！"];
  let bubT = 0;
  function say(t) { const b = $("bubble"); b.textContent = "大P神：" + t; b.classList.add("show"); clearTimeout(bubT); bubT = setTimeout(() => b.classList.remove("show"), 1800); }

  // ---------- input ----------
  function pick(ev) {
    if (!st || st.t <= 0) return;
    const r = cv.getBoundingClientRect();
    const px = ((ev.clientX - r.left) / r.width) * W, py = ((ev.clientY - r.top) / r.height) * H;
    let best = null, bd = 18;
    for (const c of creeps) { const d = Math.hypot(c.x - px, c.y - 6 - py); if (d < bd) { bd = d; best = c; } }
    if (!best || st.atk) return;
    const D = DIFF[diff];
    st.atk = { target: best, t: D.windup, dmg: Math.round(rnd(...D.dmg)) };
    st.heroX = Math.max(14, Math.min(W - 14, best.x + (best.side === "d" ? -14 : 14)));
  }
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); pick(e); });

  // ---------- loop ----------
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw();
    if (st && st.t > 0) raf = requestAnimationFrame(loop); else finish();
  }

  function update(dt) {
    st.t -= dt;
    st.nextWave -= dt;
    if (st.nextWave <= 0) { wave(); st.nextWave = 15; }
    // movimento e combattimento dei creep
    for (const c of creeps) {
      const foes = creeps.filter((o) => o.side !== c.side && o.hp > 0);
      const near = foes.filter((o) => Math.abs(o.x - c.x) < 22).sort((a, b) => Math.abs(a.x - c.x) - Math.abs(b.x - c.x))[0];
      if (near) {
        c.cd -= dt;
        if (c.cd <= 0) { near.hp -= rnd(19, 23); c.cd = rnd(0.95, 1.1); c.swing = 0.15; }
      } else {
        const dir = c.side === "r" ? 1 : -1;
        const front = c.side === "r" ? W / 2 - 8 : W / 2 + 8;
        if ((dir > 0 && c.x < front) || (dir < 0 && c.x > front)) c.x += dir * 22 * dt;
      }
      if (c.swing) c.swing = Math.max(0, c.swing - dt);
    }
    // attacco dell'eroe (con preattacco)
    if (st.atk) {
      st.atk.t -= dt;
      if (st.atk.t <= 0) {
        const c = st.atk.target, dmg = st.atk.dmg;
        st.atk = null;
        if (c.hp > 0 && creeps.includes(c)) {
          const canDeny = c.side === "r" && c.hp <= c.max / 2;
          if (c.side === "r" && !canDeny) { fx.push({ x: c.x, y: c.y - 18, t: 0.8, txt: "不能反补", col: "#94a3b8" }); }
          else {
            c.hp -= dmg;
            if (c.hp <= 0) {
              c.killer = "me";
              if (c.side === "d") { st.lh++; st.gold += 40; st.combo++; fx.push({ x: c.x, y: c.y - 18, t: 1, txt: "+40", col: "#fde047" }); if (st.combo % 5 === 0) say(GOOD[st.combo / 5 % GOOD.length | 0]); }
              else { st.dn++; st.gold += 10; fx.push({ x: c.x, y: c.y - 18, t: 1, txt: "!", col: "#7dd3fc" }); }
            } else { st.ms++; st.combo = 0; fx.push({ x: c.x, y: c.y - 18, t: 0.8, txt: "-" + dmg, col: "#f87171" }); if (st.ms % 2 === 1) say(MISS[st.ms % MISS.length]); }
          }
        } else { st.ms++; st.combo = 0; fx.push({ x: st.heroX, y: LANE_Y - 26, t: 0.8, txt: "被抢了", col: "#f87171" }); say(MISS[(st.ms + 3) % MISS.length]); }
      }
    }
    // morti: chi non è stato ucciso da te è "perso"
    for (const c of creeps) if (c.hp <= 0 && !c.dead) { c.dead = 0.5; }
    creeps.forEach((c) => { if (c.dead) c.dead -= dt; });
    creeps = creeps.filter((c) => !(c.dead && c.dead <= 0));
    fx.forEach((f) => (f.t -= dt)); fx = fx.filter((f) => f.t > 0);
    // HUD
    $("h-lh").textContent = st.lh; $("h-dn").textContent = st.dn; $("h-ms").textContent = st.ms; $("h-gd").textContent = st.gold;
    const s = Math.max(0, Math.ceil(st.t)); $("h-tm").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }

  function draw() {
    // erba, corsia, fiume, alberi
    g.fillStyle = "#2f5d2a"; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 90; i++) { g.fillStyle = i % 2 ? "#3a6f31" : "#295224"; g.fillRect((i * 53) % W, (i * 29) % H, 2, 1); }
    g.fillStyle = "#7a6a4a"; g.fillRect(0, LANE_Y - 18, W, 34);
    g.fillStyle = "#8b7a55"; for (let x = 0; x < W; x += 9) g.fillRect(x, LANE_Y - 18 + ((x * 7) % 30), 3, 2);
    g.fillStyle = "#2563eb"; g.globalAlpha = 0.55; g.fillRect(W / 2 - 10, 0, 20, H); g.globalAlpha = 1;
    for (let x = 4; x < W; x += 26) { g.drawImage(tree, x, 8 + (x % 3) * 3); g.drawImage(tree, x + 10, H - 30 - (x % 2) * 4); }
    // torri
    g.fillStyle = "#cbd5e1"; g.fillRect(6, LANE_Y - 38, 10, 30); g.fillStyle = "#86efac"; g.fillRect(8, LANE_Y - 44, 6, 6);
    g.fillStyle = "#44403c"; g.fillRect(W - 16, LANE_Y - 38, 10, 30); g.fillStyle = "#f87171"; g.fillRect(W - 14, LANE_Y - 44, 6, 6);
    // creep (ordinati per y)
    const D = DIFF[diff];
    [...creeps].sort((a, b) => a.y - b.y).forEach((c) => {
      const img = c.side === "r" ? creepR : creepD;
      g.save();
      g.translate(Math.round(c.x), Math.round(c.y));
      if (c.side === "d") g.scale(-1, 1);
      if (c.dead) { g.globalAlpha = Math.max(0, c.dead * 2); g.rotate(-1.2 * (1 - c.dead * 2)); }
      g.drawImage(img, -6 + (c.swing ? 2 : 0), -12);
      g.restore();
      if (!c.dead) {
        const w = 14, p = Math.max(0, c.hp / c.max);
        g.fillStyle = "#111"; g.fillRect(Math.round(c.x) - 7, Math.round(c.y) - 16, w, 3);
        g.fillStyle = c.side === "r" ? "#4ade80" : "#ef4444"; g.fillRect(Math.round(c.x) - 7, Math.round(c.y) - 16, Math.round(w * p), 3);
        if (c.side === "r" && p <= 0.5) { g.fillStyle = "#7dd3fc"; g.fillRect(Math.round(c.x) - 1, Math.round(c.y) - 20, 2, 2); }
        if (D.showHp) { g.fillStyle = "#fff"; g.font = "6px monospace"; g.textAlign = "center"; g.fillText(Math.max(0, Math.round(c.hp)), Math.round(c.x), Math.round(c.y) - 18); }
      }
    });
    // eroe
    const hx = Math.round(st ? st.heroX : W / 2), hy = LANE_Y + 30;
    g.drawImage(hero, hx - 6, hy - 12);
    if (st && st.atk) { const k = 1 - st.atk.t / DIFF[diff].windup; g.fillStyle = "#fde047"; g.fillRect(hx - 7, hy + 2, Math.round(14 * k), 2); }
    // effetti
    g.textAlign = "center"; g.font = "bold 8px monospace";
    fx.forEach((f) => { g.fillStyle = "#000"; g.fillText(f.txt, f.x + 1, f.y - (1 - f.t) * 10 + 1); g.fillStyle = f.col; g.fillText(f.txt, f.x, f.y - (1 - f.t) * 10); });
    // info attacco
    g.textAlign = "left"; g.font = "7px monospace"; g.fillStyle = "#000"; g.fillRect(2, H - 11, 92, 9);
    g.fillStyle = "#fde047"; g.fillText(`攻击力 ${DIFF[diff].dmg[0]}-${DIFF[diff].dmg[1]}`, 4, H - 4);
  }

  // ---------- fine partita ----------
  function finish() {
    if (!st) return;
    const who = $("who").value, score = st.lh * 2 + st.dn - st.ms;
    const acc = st.lh + st.dn + st.ms ? Math.round(((st.lh + st.dn) / (st.lh + st.dn + st.ms)) * 100) : 0;
    let bests = {}; try { bests = JSON.parse(localStorage.getItem("lh:bests") || "{}"); } catch {}
    const key = `${who}|${diff}`, prev = bests[key];
    const isBest = !prev || st.lh > prev.lh || (st.lh === prev.lh && st.dn > prev.dn);
    if (isBest) bests[key] = { who, diff, lh: st.lh, dn: st.dn, ms: st.ms, acc, at: Date.now() };
    try { localStorage.setItem("lh:bests", JSON.stringify(bests)); } catch {}
    $("end-title").textContent = isBest ? "新纪录！" : "时间到！";
    $("end-text").innerHTML = `${who} · ${DIFF[diff].name}：<b>${st.lh}</b> 补刀 · <b>${st.dn}</b> 反补 · ${st.ms} 次没补到 · 命中率 <b>${acc}%</b> · ${st.gold} 金`;
    $("end-taunt").textContent = "大P神：" + (st.lh >= 18 ? "可以，这补刀够格上万古了" : st.lh >= 12 ? "还行，比小金金强一点" : st.lh >= 6 ? "就这？回去再练练" : "补刀？Ping大神都比你会补");
    $("end").hidden = false;
    $("copy").onclick = async () => {
      const txt = `【刀塔法庭·补刀练习】${who}（${DIFF[diff].name}）2分钟 ${st.lh}补刀 ${st.dn}反补，命中率${acc}%。不服来战：${location.href.split("#")[0]}`;
      try { await navigator.clipboard.writeText(txt); $("copy").textContent = "已复制 ✔"; } catch { prompt("复制下面这段：", txt); }
      setTimeout(() => ($("copy").textContent = "复制成绩发群里"), 2000);
    };
    renderBests();
    st = null;
  }

  function renderBests() {
    let bests = {}; try { bests = JSON.parse(localStorage.getItem("lh:bests") || "{}"); } catch {}
    const rows = Object.values(bests).sort((a, b) => b.lh - a.lh || b.dn - a.dn);
    $("bests").innerHTML = rows.length
      ? `<tr><th>#</th><th>大神</th><th>难度</th><th>补刀</th><th>反补</th><th>命中率</th></tr>` + rows.map((r, i) => `<tr><td>${i + 1}</td><td>${r.who}</td><td>${DIFF[r.diff].name}</td><td>${r.lh}</td><td>${r.dn}</td><td>${r.acc}%</td></tr>`).join("")
      : `<tr><td class="muted">还没有纪录，来一局吧。</td></tr>`;
  }

  // aggancio di test (solo con ?debug): avanza il gioco a mano
  if (location.search.includes("debug")) window.__lh = { get st() { return st; }, get creeps() { return creeps; }, update, finish, hit: (c) => { st.atk = { target: c, t: DIFF[diff].windup, dmg: DIFF[diff].dmg[0] }; } };
  $("start").onclick = start;
  $("again").onclick = start;
  $("tomenu").onclick = () => { $("end").hidden = true; $("menu").hidden = false; };
  renderBests();
  st = { heroX: W / 2 }; draw(); st = null;
})();
</script>
</body>
</html>
